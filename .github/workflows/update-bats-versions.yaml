name: Update Bats repository versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set branch names
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            target_branch="$GITHUB_REF_NAME"
          else
            target_branch="$DEFAULT_BRANCH"
          fi

          echo "TARGET_BRANCH=$target_branch" >> "$GITHUB_ENV"
          echo "UPDATE_BRANCH=update-bats-versions-$target_branch" >> "$GITHUB_ENV"

      - name: Update versions and checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./update-bats-versions.sh "$GITHUB_REPOSITORY_OWNER"

      - name: Check for updates
        id: updates
        shell: bash
        run: |
          if git diff --quiet -- bats-versions.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing update pull request
        id: existing-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request="$(gh pr list --state open --head "$UPDATE_BRANCH" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$pull_request" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$pull_request" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.updates.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add bats-versions.sh
          git commit -m "Update Bats repository versions"

      - name: Push updates
        if: steps.updates.outputs.changed == 'true'
        shell: bash
        env:
          UPDATE_PR_EXISTS: ${{ steps.existing-pr.outputs.exists }}
        run: |
          if [ "$UPDATE_PR_EXISTS" = true ]; then
            git fetch origin \
              "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            expected_commit="$(git rev-parse "refs/remotes/origin/$UPDATE_BRANCH")"
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:$expected_commit" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

      - name: Create pull request
        if: steps.updates.outputs.changed == 'true' && steps.existing-pr.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "Update Bats repository versions" \
            --body "Updates Bats repositories to their latest release tags and refreshes their SHA-256 checksums."

      - name: Close obsolete pull request
        if: steps.updates.outputs.changed == 'false' && steps.existing-pr.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
        run: |
          gh pr close "$UPDATE_PR_NUMBER" \
            --delete-branch \
            --comment "Closing because all Bats repository versions and checksums are current on $TARGET_BRANCH."
