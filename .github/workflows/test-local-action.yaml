name: CI local_test
on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]
  push:
    branches: ["main"]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'release' && '-release' || '' }}
  cancel-in-progress: true

jobs:
  local_test:
    strategy:
      fail-fast: false
      matrix:
        version: ["1.7.0", "1.9.0", "1.11.0", "latest"]
        os: [ ubuntu-22.04, ubuntu-latest, windows-2022, windows-latest, macos-14, macos-latest ]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    name: local
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Setup Bats and Bats libs
        id: setup-bats
        uses: ./
        with:
          bats-version: ${{ matrix.version }}
          support-clean: "false"
          assert-clean: "false"
          detik-clean: "false"
          file-clean: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check bats libs source path
        shell: bash
        env:
          TMP_PATH: ${{ steps.setup-bats.outputs.tmp-path }}
        run: |
          set -eu
          [[ -d "${TMP_PATH}/bats-support" ]] || echo "DOWNLOAD_BATS_SUPPORT=1">>${GITHUB_ENV}
          [[ -d "${TMP_PATH}/bats-assert" ]] || echo "DOWNLOAD_BATS_ASSERT=1">>${GITHUB_ENV}
          [[ -d "${TMP_PATH}/bats-detik" ]] || echo "DOWNLOAD_BATS_DETIK=1">>${GITHUB_ENV}
          [[ -d "${TMP_PATH}/bats-file" ]] || echo "DOWNLOAD_BATS_FILE=1">>${GITHUB_ENV}
      - name: Set cache for Bats-support source
        if: env.DOWNLOAD_BATS_SUPPORT == '1'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        id: support-source-cache
        with:
          path: ${{ steps.setup-bats.outputs.tmp-path }}/bats-support
          key: ${{ runner.os }}-${{ runner.arch }}-bats-support-${{ env.SUPPORT_VERSION }}-source
      - name: Download Bats-support source
        if: env.DOWNLOAD_BATS_SUPPORT == '1' && steps.support-source-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: latest
          TARGET_DIR: ${{ steps.setup-bats.outputs.tmp-path }}/bats-support
        run: |
          ./download-bats-lib.sh  'bats-core/bats-support'  "$VERSION"  "$TARGET_DIR"
      - name: Set cache for Bats-assert source
        if: env.DOWNLOAD_BATS_ASSERT == '1'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        id: assert-source-cache
        with:
          path: ${{ steps.setup-bats.outputs.tmp-path }}/bats-assert
          key: ${{ runner.os }}-${{ runner.arch }}-bats-assert-${{ env.ASSERT_VERSION }}-source
      - name: Download Bats-assert source
        if: env.DOWNLOAD_BATS_ASSERT == '1' && steps.assert-source-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: latest
          TARGET_DIR: ${{ steps.setup-bats.outputs.tmp-path }}/bats-assert
        run: |
          ./download-bats-lib.sh  'bats-core/bats-assert'  "$VERSION"  "$TARGET_DIR"
      - name: Set cache for Bats-detik source
        if: env.DOWNLOAD_BATS_DETIK == '1'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        id: detik-source-cache
        with:
          path: ${{ steps.setup-bats.outputs.tmp-path }}/bats-detik
          key: ${{ runner.os }}-${{ runner.arch }}-bats-detik-${{ env.DETIK_VERSION }}-source
      - name: Download Bats-detik source
        if: env.DOWNLOAD_BATS_DETIK == '1' && steps.detik-source-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: latest
          TARGET_DIR: ${{ steps.setup-bats.outputs.tmp-path }}/bats-detik
        run: |
          ./download-bats-lib.sh  'bats-core/bats-detik'  "$VERSION"  "$TARGET_DIR"
      - name: Set cache for Bats-file source
        if: env.DOWNLOAD_BATS_FILE == '1'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        id: file-source-cache
        with:
          path: ${{ steps.setup-bats.outputs.tmp-path }}/bats-file
          key: ${{ runner.os }}-${{ runner.arch }}-bats-file-${{ env.FILE_VERSION }}-source
      - name: Download Bats-file source
        if: env.DOWNLOAD_BATS_FILE == '1' && steps.file-source-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: latest
          TARGET_DIR: ${{ steps.setup-bats.outputs.tmp-path }}/bats-file
        run: |
          ./download-bats-lib.sh  'bats-core/bats-file'  "$VERSION"  "$TARGET_DIR"

      - name: Execute test to check Bats-support
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TMP_PATH: ${{ steps.setup-bats.outputs.tmp-path }}
        run: |
          cd ${TMP_PATH}/bats-support/
          echo $BATS_LIB_PATH
          bats test
      - name: Execute test to check  Bats-assert
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TMP_PATH: ${{ steps.setup-bats.outputs.tmp-path }}
        run: |
          cd ${TMP_PATH}/bats-assert/
          bats test
      - name: Execute test to check Bats-detik
        shell: bash
        continue-on-error: true
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TMP_PATH: ${{ steps.setup-bats.outputs.tmp-path }}
        run: |
          cd ${TMP_PATH}/bats-detik/
          bats tests
      - name: Execute test to check Bats-file
        shell: bash
        # Currently the bats-file tests are broken
        # in gh runner env
        continue-on-error: true
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TMP_PATH: ${{ steps.setup-bats.outputs.tmp-path }}
        run: |
          cd ${TMP_PATH}/bats-file/
          bats test
      - name: Execute example tests
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
        shell: bash
        run:
          bats -T -p tests

  local_test_trigger_cache:
    needs: [local_test]
    strategy:
      fail-fast: false
      matrix:
        version: ["1.7.0", "1.9.0", "1.11.0", "latest"]
        os: [ ubuntu-22.04, ubuntu-latest, windows-2022, windows-latest, macos-14, macos-latest ]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    name: local-default-no-cache
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Setup Bats and Bats libs
        uses: ./
        id: setup-bats
        with:
          bats-version: ${{ matrix.version }}
          support-clean: "false"
          assert-clean: "false"
          detik-clean: "false"
          file-clean: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute example tests
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
        shell: bash
        run:
          bats -T -p tests
