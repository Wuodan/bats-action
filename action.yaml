name: Setup Bats and Bats libraries
description: A GitHub Action for installing Bats and Bats libraries (support, assert, detik, file)
author: bats-core
branding:
  color: yellow
  icon: command

outputs:
  lib-path:
    description: Bats library search path
    value: ${{ steps.config.outputs.install-path }}
  bats-version:
    description: Installed bats-core version
    value: ${{ steps.config.outputs.bats-version }}
  support-version:
    description: Installed bats-support version
    value: ${{ steps.config.outputs.support-version }}
  assert-version:
    description: Installed bats-assert version
    value: ${{ steps.config.outputs.assert-version }}
  detik-version:
    description: Installed bats-detik version
    value: ${{ steps.config.outputs.detik-version }}
  file-version:
    description: Installed bats-file version
    value: ${{ steps.config.outputs.file-version }}

runs:
  using: composite
  steps:
    - name: Define versions and install target
      id: config
      shell: bash
      run: |
        set -eu

        install_path="$HOME/.local/share/bats"

        {
          echo "bats-version=1.14.0"
          echo "support-version=0.3.0"
          echo "assert-version=2.2.4"
          echo "detik-version=1.3.2"
          echo "file-version=0.4.0"
          echo "install-path=$install_path"
        } >> "$GITHUB_OUTPUT"

        echo "BATS_LIB_PATH=$install_path" >> "$GITHUB_ENV"

    - name: Download and install Bats and Bats libraries
      shell: bash
      env:
        BATS_VERSION: ${{ steps.config.outputs.bats-version }}
        SUPPORT_VERSION: ${{ steps.config.outputs.support-version }}
        ASSERT_VERSION: ${{ steps.config.outputs.assert-version }}
        DETIK_VERSION: ${{ steps.config.outputs.detik-version }}
        FILE_VERSION: ${{ steps.config.outputs.file-version }}
        INSTALL_PATH: ${{ steps.config.outputs.install-path }}
      run: '"$GITHUB_ACTION_PATH/install-bats.sh"'

    - name: Add Bats to PATH
      shell: bash
      env:
        INSTALL_PATH: ${{ steps.config.outputs.install-path }}
      run: echo "$INSTALL_PATH/bin" >> "$GITHUB_PATH"
